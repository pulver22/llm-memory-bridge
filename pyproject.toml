[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory-bridge"
version = "0.1.0"
description = "Model-agnostic ChatGPT & Codex memory export, distillation, and Obsidian vault bridge for AI coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "pulver22" },
]
keywords = [
  "llm",
  "memory",
  "chatgpt",
  "codex",
  "claude",
  "obsidian",
  "cli",
  "agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
memory-bridge = "memory_bridge.cli:main"
llm-memory-bridge = "memory_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/pulver22/llm-memory-bridge"
Repository = "https://github.com/pulver22/llm-memory-bridge"
Issues = "https://github.com/pulver22/llm-memory-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
